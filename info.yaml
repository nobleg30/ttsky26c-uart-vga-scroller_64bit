# Tiny Tapeout project information

project:
  title: "UART VGA Text Scroller"
  author: "Noble G"
  discord: ""
  description: "Receives up to 64 characters over UART and scrolls 4x-scaled colour-selectable text across a 640x480 VGA display. Includes an independent 2-bit combinational ALU on the bidirectional pins."
  language: "Verilog"
  clock_hz: 25175000
  tiles: "1x2"
  top_module: "tt_um_nobleg30_uart_vga_scroller"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "Scroll speed bit 0"
  ui[1]: "Scroll speed bit 1"
  ui[2]: "Pause scrolling"
  ui[3]: "UART RX"
  ui[4]: "Text colour bit 0"
  ui[5]: "Text colour bit 1"
  ui[6]: "Background colour bit 0"
  ui[7]: "Background colour bit 1"

  # Outputs: TinyVGA RGB222 mapping
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # Bidirectional pins: 2-bit combinational ALU
  uio[0]: "ALU A bit 0 (input)"
  uio[1]: "ALU A bit 1 (input)"
  uio[2]: "ALU B bit 0 (input)"
  uio[3]: "ALU B bit 1 (input)"
  uio[4]: "ALU select bit 0 (input)"
  uio[5]: "ALU select bit 1 (input)"
  uio[6]: "ALU Y bit 0 (output)"
  uio[7]: "ALU Y bit 1 (output)"

yaml_version: 6
